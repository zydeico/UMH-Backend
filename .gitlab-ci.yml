stages:
  - build
  - deploy

docker-build:
  image: docker:cli
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --pull -t "$DOCKER_IMAGE_NAME" .
    - docker push "$DOCKER_IMAGE_NAME"
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "$DOCKER_IMAGE_NAME" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH
      exists:
        - Dockerfile

deploy:
  image: google/cloud-sdk:latest
  stage: deploy
  variables:
    USERNAME: $USERNAME
    SECRET_KEY: $SECRET_KEY
    USER_ID: $USER_ID
    FIREBASE_TYPE: $FIREBASE_TYPE
    FIREBASE_PROJECT_ID: $FIREBASE_PROJECT_ID
    FIREBASE_PRIVATE_KEY_ID: $FIREBASE_PRIVATE_KEY_ID
    FIREBASE_PRIVATE_KEY: $FIREBASE_PRIVATE_KEY
    FIREBASE_CLIENT_EMAIL: $FIREBASE_CLIENT_EMAIL
    FIREBASE_CLIENT_ID: $FIREBASE_CLIENT_ID
    FIREBASE_AUTH_URI: $FIREBASE_AUTH_URI
    FIREBASE_TOKEN_URI: $FIREBASE_TOKEN_URI
    FIREBASE_AUTH_PROVIDER_X509_CERT_URL: $FIREBASE_AUTH_PROVIDER_X509_CERT_URL
    FIREBASE_CLIENT_X509_CERT_URL: $FIREBASE_CLIENT_X509_CERT_URL
    FIREBASE_UNIVERSE_DOMAIN: $FIREBASE_UNIVERSE_DOMAIN
    OCMP_SUBSCRIPTION_KEY: $OCMP_SUBSCRIPTION_KEY
    PORT: $PORT
    MOBILEUSERCOLLECTIONNAME: $MOBILEUSERCOLLECTIONNAME
    BACKUPCOLLECTIONNAME: $BACKUPCOLLECTIONNAME
    BLOCKEDIPCOLLECTIONNAME: $BLOCKEDIPCOLLECTIONNAME
    EMAILSCOLLECTION: $EMAILSCOLLECTION
    CONFIGURATIONVALUESCOLLECTION: $CONFIGURATIONVALUESCOLLECTION
    CARDSTYPESSUBCOLLECTION: $CARDSTYPESSUBCOLLECTION
    STATESSUBCOLLECTION: $STATESSUBCOLLECTION
    STATESFIELD: $STATESFIELD
    FAMILIARSUBCOLLECTION: $FAMILIARSUBCOLLECTION
    LETTERSSUBCOLLECTION: $LETTERSSUBCOLLECTION
    CONTACTSSUBCOLLECTION: $CONTACTSSUBCOLLECTION
    FAVORITESSUBCOLLECTION: $FAVORITESSUBCOLLECTION
    DISTRIBUTIONSSUBCOLLECTION: $DISTRIBUTIONSSUBCOLLECTION
    GIFTSSUBCOLLECTION: $GIFTSSUBCOLLECTION
    NOTESSUBCOLLECTION: $NOTESSUBCOLLECTION
    TASKSSUBCOLLECTION: $TASKSSUBCOLLECTION
    LEGACYSUBCOLLECTION: $LEGACYSUBCOLLECTION
    LINKSSUBCOLLECTION: $LINKSSUBCOLLECTION
    MEXICOLANGUAGECODE: $MEXICOLANGUAGECODE
    UNITEDSTATESLANGUAGECODE: $UNITEDSTATESLANGUAGECODE
    MEXICOSTATESFIELDCOLLECTION: $MEXICOSTATESFIELDCOLLECTION
    UNITEDSTATESSTATESFIELDCOLLECTION: $UNITEDSTATESSTATESFIELDCOLLECTION
    CONTACTSTYPESSUBCOLLECTION: $CONTACTSTYPESSUBCOLLECTION
    FAMILYMEMBERMEXICO: $FAMILYMEMBERMEXICO
    FAMILYMEMBERSUNITEDSTATES: $FAMILYMEMBERSUNITEDSTATES
    CONTACTTYPESMEXICO: $CONTACTTYPESMEXICO
    CONTACTTYPESUNITEDSTATES: $CONTACTTYPESUNITEDSTATES
    CATEGORYTYPESSUBCOLLECTION: $CATEGORYTYPESSUBCOLLECTION
    CategoryTypeEN: $CategoryTypeEN
    CategoryTypeES: $CategoryTypeES
    GIFTSCONFIGURATIONVALUESSUBCOLLECTION: $GIFTSCONFIGURATIONVALUESSUBCOLLECTION
    SpecialOcassionEN: $SpecialOcassionEN
    SpecialOcassionES: $SpecialOcassionES
    LegacyContactCollection: $LegacyContactCollection
    STRIPE_API_KEY: $STRIPE_API_KEY
    GCLOUD_SERVICE_KEY: $GCLOUD_SERVICE_KEY
  script:
    - echo $GCLOUD_SERVICE_KEY | base64 -d > key.json
    - gcloud auth activate-service-account --key-file=key.json
    - gcloud config set project $FIREBASE_PROJECT_ID
    - gcloud config set run/region $FIREBASE_UNIVERSE_DOMAIN
    - gcloud services enable cloudbuild.googleapis.com
    - gcloud services enable run.googleapis.com
    - gcloud services enable containerregistry.googleapis.com
    - gcloud builds submit --tag gcr.io/$FIREBASE_PROJECT_ID/umhbackend:$CI_COMMIT_REF_SLUG
    - gcloud run deploy umhbackend \
      --image gcr.io/$FIREBASE_PROJECT_ID/umhbackend:$CI_COMMIT_REF_SLUG \
      --platform managed \
      --region us-west1 \
      --project $FIREBASE_PROJECT_ID \
      --allow-unauthenticated
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
